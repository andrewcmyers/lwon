[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lwon"
version = "0.1.0"
description = "Reading and writing LWON (Light-Weight Object Notation)"
authors = [{ name = "Andrew Myers" }]
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/andrewcmyers/lwon"

[project.scripts]
lwon-dump = "lwon.__main__:main"

[tool.setuptools]
packages = ["lwon"]
