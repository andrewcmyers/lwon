plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

repositories {
    mavenCentral()
}

// Main class configuration
application {
    mainClass = 'lwon.Dump'
}

// Set up jar task; classifier keeps it from colliding with the shadow jar (lwon.jar)
tasks.named('jar') {
    archiveClassifier = 'plain'
    manifest {
        attributes 'Main-Class': application.mainClass
    }
}

// Include all source directories
sourceSets {
    main {
        java {
            srcDirs = ['java/src', 'java/test', 'java/easyIO/src']
        }
    }
}

// Enable preview features
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ["--enable-preview"]
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

def updateSubmodules = tasks.register('updateSubmodules', Exec) {
    commandLine 'git', 'submodule', 'update', '--init'
}

tasks.named('compileJava') {
    dependsOn updateSubmodules
}

tasks.named('shadowJar') {
    archiveBaseName = 'lwon'
    archiveClassifier = ''
}

// Language-independent regression tests: bin/run-tests runs bin/dump on each
// tests/*/input.txt and diffs against output.txt.
def runTests = tasks.register('runTests', Exec) {
    description = 'Runs the LWON regression tests in tests/ against the Java implementation.'
    group = 'verification'
    dependsOn tasks.named('shadowJar')
    workingDir = projectDir
    commandLine 'bin/run-tests'
}

tasks.named('test') {
    dependsOn runTests
}

tasks.register('generateJavadoc', Javadoc) {
    source = sourceSets.main.allJava
    classpath = sourceSets.main.compileClasspath
    destinationDir = layout.buildDirectory.dir('docs/javadoc').get().asFile
    options.links("https://docs.oracle.com/en/java/javase/21/docs/api/")
}
